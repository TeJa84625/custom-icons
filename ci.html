<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        /* Ensure the SVG fills the viewport cleanly for embedding */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            overflow: hidden;
        }

        svg {
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: contain !important;
            display: block;
        }
    </style>
</head>

<body>
    <script>
        const defaultFallbackSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img"><path d="M1.927 23.935a2.4 2.4 0 0 1-1.882-1.883 2.4 2.4 0 0 1 2.82-2.82 2.4 2.4 0 0 1 1.882 1.882 2.4 2.4 0 0 1-2.82 2.82zM21.135 4.768a2.4 2.4 0 0 1-1.882-1.882 2.4 2.4 0 0 1 2.82-2.82 2.4 2.4 0 0 1 1.882 1.882 2.4 2.4 0 0 1-2.82 2.82zM12.021 6.01c1.147 0 2.219.324 3.13.883l2.585-2.585A9.583 9.583 0 0 0 4.328 17.716l2.586-2.586a5.99 5.99 0 0 1 5.107-9.12zm5.107 2.86a5.99 5.99 0 0 1-8.237 8.237l-2.586 2.585A9.583 9.583 0 0 0 19.713 6.284z" fill="#000000"/></svg>';

        function normalizeColor(color) {
            if (!color) return '';
            color = color.trim();
            const isHex = /^[0-9A-Fa-f]{3,8}$/.test(color);
            if (isHex) {
                return '#' + color;
            }
            return color;
        }

        function formatSvgString(svgString, rawColorCode, uniqueId = 'embed') {
            const customColor = normalizeColor(rawColorCode);

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(svgString, 'image/svg+xml');
                const svgEl = doc.querySelector('svg');
                if (!svgEl) return svgString;

                // Force scalable ViewBox if missing
                if (!svgEl.hasAttribute('viewBox')) {
                    const w = svgEl.getAttribute('width');
                    const h = svgEl.getAttribute('height');
                    const pw = parseFloat(w) || 24;
                    const ph = parseFloat(h) || 24;
                    svgEl.setAttribute('viewBox', `0 0 ${pw} ${ph}`);
                }

                // Clean up explicit widths/heights so CSS sizing takes over perfectly 
                svgEl.removeAttribute('width');
                svgEl.removeAttribute('height');

                // Safe ID collision rewritter
                const idMap = {};
                svgEl.querySelectorAll('[id]').forEach(el => {
                    const oldId = el.getAttribute('id');
                    if (oldId && !oldId.startsWith('ci-')) {
                        const newId = `ci-${uniqueId}-${oldId}`.replace(/[^a-zA-Z0-9-_]/g, '');
                        el.setAttribute('id', newId);
                        idMap[oldId] = newId;
                    }
                });

                // Remap url(#id) references
                if (Object.keys(idMap).length > 0) {
                    svgEl.querySelectorAll('*').forEach(el => {
                        Array.from(el.attributes).forEach(attr => {
                            let val = attr.value;
                            if (val.includes('url(#')) {
                                Object.keys(idMap).forEach(oldId => {
                                    val = val.split(`url(#${oldId})`).join(`url(#${idMap[oldId]})`);
                                });
                                if (val !== attr.value) el.setAttribute(attr.name, val);
                            }
                            if ((attr.name === 'href' || attr.name === 'xlink:href') && val.startsWith('#')) {
                                const oldId = val.substring(1);
                                if (idMap[oldId]) el.setAttribute(attr.name, `#${idMap[oldId]}`);
                            }
                        });
                    });
                }

                // Deep Apply Color if provided
                if (customColor) {
                    svgEl.style.color = customColor;
                    const rootFill = svgEl.getAttribute('fill');
                    if (!rootFill || (rootFill !== 'none' && !rootFill.includes('url('))) {
                        svgEl.setAttribute('fill', customColor);
                    }

                    const applyColor = (el) => {
                        const fillAttr = el.getAttribute('fill');
                        if (fillAttr && fillAttr !== 'none' && !fillAttr.includes('url(')) {
                            el.setAttribute('fill', customColor);
                        }
                        if (el.style && el.style.fill && el.style.fill !== 'none' && !el.style.fill.includes('url(')) {
                            el.style.fill = customColor;
                        }

                        const strokeAttr = el.getAttribute('stroke');
                        if (strokeAttr && strokeAttr !== 'none' && !strokeAttr.includes('url(')) {
                            el.setAttribute('stroke', customColor);
                        }
                        if (el.style && el.style.stroke && el.style.stroke !== 'none' && !el.style.stroke.includes('url(')) {
                            el.style.stroke = customColor;
                        }
                    };

                    svgEl.querySelectorAll('path, circle, rect, polygon, polyline, ellipse, line, g').forEach(applyColor);
                }

                return new XMLSerializer().serializeToString(svgEl);
            } catch (e) {
                console.error("SVG Formatting Error: ", e);
                return svgString;
            }
        }

        async function renderIcon() {
            // Get hash and split by '#' to separate the icon ID and color
            // Example: #hashKey-iconName#ff0000
            const hash = window.location.hash ? window.location.hash.substring(1) : '';
            const hashParts = hash.split('#');
            const fullIconId = hashParts[0] ? decodeURIComponent(hashParts[0]) : '';
            const colorCode = hashParts[1] ? decodeURIComponent(hashParts[1]) : '';

            let finalSvg = defaultFallbackSvg;

            if (fullIconId) {
                try {
                    // 1. Fetch the master index
                    const indexRes = await fetch('save/svgs.json');

                    if (indexRes.ok) {
                        const masterIndex = await indexRes.json();
                        const indices = masterIndex.indices || [];

                        let targetFile = null;
                        let targetIconName = null;

                        // 2. Find which library file this icon belongs to using the key prefix
                        for (const item of indices) {
                            const fileTag = item.file.replace('.json', '');
                            const encryptionKey = item.key || fileTag.replace(/[^a-zA-Z0-9]/g, '');

                            // Check if the requested ID starts with this library's key + "-"
                            if (fullIconId.startsWith(encryptionKey + '-')) {
                                targetFile = item.file;
                                // The actual icon name inside the sub-file is everything after the prefix
                                targetIconName = fullIconId.substring(encryptionKey.length + 1);
                                break;
                            }
                        }

                        // 3. Fetch the specific library file and extract the SVG
                        if (targetFile && targetIconName) {
                            const libRes = await fetch(`save/${targetFile}`);
                            if (libRes.ok) {
                                const libData = await libRes.json();
                                const icons = libData.icons || {};
                                const iconObj = icons[targetIconName];

                                if (iconObj) {
                                    finalSvg = (typeof iconObj === 'object' && iconObj.svg)
                                        ? iconObj.svg
                                        : iconObj;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.error("Failed to fetch icon data", e);
                }
            }

            // 4. Format, apply colors, fix viewboxes, and inject to DOM
            finalSvg = formatSvgString(finalSvg, colorCode, fullIconId || 'fallback');
            document.body.innerHTML = finalSvg;
        }

        renderIcon();
    </script>
</body>

</html>
