<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI Icons - Explorer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Side-by-Side Header Layout */
    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-bottom: 1.8rem;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Total Icons Badge with Pulsing Live Dot */
    .total-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .live-pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse-animation 1.6s infinite;
    }

    @keyframes pulse-animation {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }

      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    /* Search Input Wrapper with Clear Button */
    .search-input-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper input {
      width: 100%;
      padding-right: 30px;
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted, #999);
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 2px 6px;
      border-radius: 50%;
    }

    .search-clear-btn:hover {
      color: var(--text-primary, #333);
    }

    /* Source library tag on cards */
    .icon-source-tag {
      font-size: 0.68rem;
      opacity: 0.55;
      text-transform: lowercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Animated Tag Badges */
    .animated-badge {
      font-size: 0.62rem;
      background: rgba(236, 72, 153, 0.2);
      color: #ec4899;
      border: 1px solid rgba(236, 72, 153, 0.4);
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .animated-dot-compact {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      background-color: #ec4899;
      border-radius: 50%;
    }

    /* Universal SVG Constraint (Fixes anomalous sizes) */
    .svg-container svg {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
      display: block;
    }

    /* Compact Mode Grid Enhancements */
    .icon-grid.compact-mode {
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)) !important;
      gap: 8px !important;
    }

    .icon-card.compact-tile {
      padding: 6px !important;
      min-height: 56px !important;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-card.compact-tile .icon-name,
    .icon-card.compact-tile .icon-version,
    .icon-card.compact-tile .icon-source-tag,
    .icon-card.compact-tile .animated-badge {
      display: none !important;
    }

    /* Toggle Switch Component */
    .view-toggle-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      user-select: none;
      cursor: pointer;
    }

    .switch-input {
      display: none;
    }

    .switch-slider {
      position: relative;
      width: 36px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    .switch-slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .switch-input:checked+.switch-slider {
      background-color: #3b82f6;
    }

    .switch-input:checked+.switch-slider::before {
      transform: translateX(16px);
    }

    .loading-state-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      color: var(--text-muted, #999);
      font-size: 1rem;
      gap: 12px;
    }

    .loading-spinner-icon {
      font-size: 2.5rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* Advanced Filters Container */
    .advanced-filters {
      display: flex;
      gap: 16px;
      width: 100%;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>

<body>

  <!-- Hidden Liquid Lens SVG Filter for Custom Sliders -->
  <svg width="0" height="0" style="position:absolute;">
    <filter id="mini-liquid-lens" x="-50%" y="-50%" width="200%" height="200%">
      <feImage x="0" y="0" result="normalMap" xlink:href="data:image/svg+xml;utf8,
      <svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>
        <radialGradient id='invmap' cx='50%' cy='50%' r='75%'>
          <stop offset='0%' stop-color='rgb(128,128,255)'/>
          <stop offset='90%' stop-color='rgb(255,255,255)'/>
        </radialGradient>
        <rect width='100%' height='100%' fill='url(#invmap)'/>
      </svg>" />
      <feDisplacementMap in="SourceGraphic" in2="normalMap" scale="-252" xChannelSelector="R" yChannelSelector="G"
        result="displaced" />
      <feMerge>
        <feMergeNode in="displaced" />
      </feMerge>
    </filter>
  </svg>

  <!-- Dotted Background -->
  <svg class="bg-pattern" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="var(--pattern-color)"></circle>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"></rect>
  </svg>

  <!-- Floating Glass Nav -->
  <nav class="floating-glass-nav">
    <div class="nav-left">
      <a href="index.html" class="nav-brand"
        style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
          <svg width="24px" height="24px" viewBox="0 0 24 24" role="img" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor"
              d="M1.927 23.935a2.4 2.4 0 0 1-1.882-1.883 2.4 2.4 0 0 1 2.82-2.82 2.4 2.4 0 0 1 1.882 1.882 2.4 2.4 0 0 1-2.82 2.82zM21.135 4.768a2.4 2.4 0 0 1-1.882-1.882 2.4 2.4 0 0 1 2.82-2.82 2.4 2.4 0 0 1 1.882 1.882 2.4 2.4 0 0 1-2.82 2.82zM12.021 6.01c1.147 0 2.219.324 3.13.883l2.585-2.585A9.583 9.583 0 0 0 4.328 17.716l2.586-2.586a5.99 5.99 0 0 1 5.107-9.12zm5.107 2.86a5.99 5.99 0 0 1-8.237 8.237l-2.586 2.585A9.583 9.583 0 0 0 19.713 6.284z" />
          </svg>
        </div>
      </a>
    </div>
    <div class="nav-right">
      <a href="icons.html" class="active">Icons</a>
      <a href="setup.html">Setup</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Mode">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </nav>

  <main>
    <!-- Side-by-Side Header Section with Live Pulsing Dot -->
    <div class="header-container">
      <h1 class="page-title" style="margin: 0;">Icon Explorer</h1>
      <span id="totalIconsBadge" class="total-badge">
        <span class="live-pulse-dot"></span>
        <span id="totalCountText">0 icons</span>
      </span>
    </div>

    <!-- Pure Glass Toolbar -->
    <div class="glass-toolbar" style="flex-direction: column; align-items: stretch;">

      <!-- Primary Controls -->
      <div style="display: flex; gap: 10px; width: 100%; flex-wrap: wrap; align-items: center;">
        <!-- Search Input Wrapper with Clear Button -->
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" class="glass-input" placeholder="Search icons...">
          <button id="searchClearBtn" class="search-clear-btn" title="Clear Search">&times;</button>
        </div>

        <select id="categorySelect" class="glass-select">
          <option value="all">All Sets</option>
        </select>

        <select id="authorSelect" class="glass-select">
          <option value="all">All Authors</option>
        </select>

        <select id="sortSelect" class="glass-select">
          <option value="name-asc">Sort: Name (A-Z)</option>
          <option value="name-desc">Sort: Name (Z-A)</option>
          <option value="version">Sort: Version</option>
        </select>
      </div>

      <!-- Advanced Filters (Toggles) -->
      <div class="advanced-filters">
        <!-- Animated Filter Toggle -->
        <label class="view-toggle-container" title="Show only animated icons">
          <span>Animated Only</span>
          <input type="checkbox" id="animatedToggle" class="switch-input">
          <span class="switch-slider"></span>
        </label>

        <!-- Colored Filter Toggle -->
        <label class="view-toggle-container" title="Show only colored/fixed-color icons">
          <span>Colored Only</span>
          <input type="checkbox" id="coloredToggle" class="switch-input">
          <span class="switch-slider"></span>
        </label>
      </div>

      <!-- Visualization Controls -->
      <div class="filter-controls" style="margin-top: 8px;">
        <!-- Color Picker & Hex Code Input Group -->
        <div class="glass-control-group color-picker-wrapper">
          <label for="colorPicker">Color:</label>
          <input type="color" id="colorPicker" value="#3b82f6">
          <input type="text" id="hexInput" class="hex-input" value="#3b82f6" maxlength="7">
        </div>

        <!-- Size Slider -->
        <div class="glass-control-group">
          <label>Size:</label>
          <div class="slider-container" id="sizeSlider">
            <div class="slider-progress" id="sizeProgress"></div>
            <div class="slider-thumb-glass" id="sizeThumb">
              <div class="slider-thumb-glass-filter"></div>
              <div class="slider-thumb-glass-overlay"></div>
              <div class="slider-thumb-glass-specular"></div>
            </div>
          </div>
          <span id="sizeValue" class="slider-value">24px</span>
        </div>

        <!-- Compact View Switch -->
        <label class="view-toggle-container" title="Hide icon titles and version info for a high-density icon grid">
          <span>Compact Grid</span>
          <input type="checkbox" id="compactModeToggle" class="switch-input">
          <span class="switch-slider"></span>
        </label>

        <select id="limitSelect" class="glass-select" style="margin-left: auto;">
          <option value="50">50 per page</option>
          <option value="100">100 per page</option>
          <option value="200" selected>200 per page</option>
          <option value="500">500 per page</option>
        </select>
      </div>
    </div>

    <!-- Icon Grid -->
    <div class="icon-grid" id="iconGrid"></div>

    <!-- Dot Pagination Bar -->
    <div class="pagination-bar" id="paginationBar"></div>
  </main>

  <!-- Icon Detail Popup Modal -->
  <div id="iconModal" class="modal-backdrop">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">&times;</button>
      <div id="modalBody"
        style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;">
        <!-- Dynamically filled -->
      </div>
    </div>
  </div>

  <script>
    // --- List of libraries to preserve original colors (Fallback) ---
    const COLOR_PRESERVED_LIBRARIES = [
      'google-color', 'flat-color-icons', 'logos', 'vscode-icons', 'cryptocurrency-color', 'emojione-v1', 'noto', 'streamline-plump-color',
      'devicon', 'flag', 'flagpack', 'circle-flags', 'cib', 'noto-v1', 'token-branded', 'fxemoji', 'emojione', 'twemoji', 'openmoji',
      'cryptocurrency-icons', 'color-icons', 'simple-icons', 'skill-icons', 'streamline-flex-color', 'fluent-emoji-flat'
    ];

    // --- Theme & Intelligent Default Color Logic ---
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;
    const themeIcon = document.getElementById('theme-icon');
    const colorPicker = document.getElementById('colorPicker');
    const hexInput = document.getElementById('hexInput');

    function updateThemeDefaults(isDark) {
      themeIcon.innerHTML = isDark
        ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`
        : `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      body.classList.add('dark-mode');
      updateThemeDefaults(true);
    } else {
      updateThemeDefaults(false);
    }

    function showToast(message, color = '#333') {
      const existingToast = document.getElementById('custom-toast');
      if (existingToast) existingToast.remove();

      const toast = document.createElement('div');
      toast.id = 'custom-toast';
      toast.textContent = message;
      Object.assign(toast.style, {
        position: 'fixed',
        top: '20px',
        right: '20px',
        backgroundColor: color,
        color: '#fff',
        padding: '10px 18px',
        borderRadius: '6px',
        boxShadow: '0 4px 12px rgba(0, 0, 0, 0.15)',
        zIndex: '9999',
        fontSize: '14px',
        fontFamily: 'sans-serif',
        opacity: '0',
        transition: 'opacity 0.3s ease, transform 0.3s ease',
        transform: 'translateY(-10px)'
      });
      document.body.appendChild(toast);
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateY(0)';
      });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    toggleBtn.addEventListener('click', () => {
      const isDark = body.classList.toggle('dark-mode');
      updateThemeDefaults(isDark);
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    colorPicker.addEventListener('input', (e) => {
      const val = e.target.value;
      hexInput.value = val;
      localStorage.setItem('iconColor', val);
      renderGrid();
    });

    hexInput.addEventListener('input', (e) => {
      let val = e.target.value;
      if (!val.startsWith('#')) val = '#' + val;
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        colorPicker.value = val;
        localStorage.setItem('iconColor', val);
        renderGrid();
      }
    });

    // --- State Variables ---
    let indexData = [];
    let masterMetadata = new Map();
    let allAuthors = new Set();
    const hashMap = new Map();
    const loadedFilesCache = new Map();
    let iconsData = [];
    let filteredIcons = [];
    let currentPage = 1;
    let itemsPerPage = 200;
    let iconSizeVal = 24;

    let isCompactMode = localStorage.getItem('compactMode') === 'true';
    let savedColor = localStorage.getItem('iconColor') || '#3b82f6';

    // Controls Elements
    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');

    // Selects & Filters
    const categorySelect = document.getElementById('categorySelect');
    const authorSelect = document.getElementById('authorSelect');
    const sortSelect = document.getElementById('sortSelect');
    const limitSelect = document.getElementById('limitSelect');

    const animatedToggle = document.getElementById('animatedToggle');
    const coloredToggle = document.getElementById('coloredToggle');

    const iconGrid = document.getElementById('iconGrid');
    const paginationBar = document.getElementById('paginationBar');
    const compactModeToggle = document.getElementById('compactModeToggle');
    const totalCountText = document.getElementById('totalCountText');

    const iconModal = document.getElementById('iconModal');
    const closeModalBtn = document.getElementById('closeModal');
    const modalBody = document.getElementById('modalBody');

    compactModeToggle.checked = isCompactMode;
    compactModeToggle.addEventListener('change', (e) => {
      isCompactMode = e.target.checked;
      localStorage.setItem('compactMode', isCompactMode);
      renderGrid();
    });

    searchInput.addEventListener('input', () => {
      searchClearBtn.style.display = searchInput.value ? 'block' : 'none';
      currentPage = 1;
      applyFilters();
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchClearBtn.style.display = 'none';
      currentPage = 1;
      applyFilters();
    });

    // Listeners for filters
    categorySelect.addEventListener('change', () => { currentPage = 1; applyFilters(); });
    authorSelect.addEventListener('change', () => { currentPage = 1; applyFilters(); });
    sortSelect.addEventListener('change', () => { currentPage = 1; applyFilters(); });
    limitSelect.addEventListener('change', (e) => { itemsPerPage = parseInt(e.target.value); currentPage = 1; applyFilters(); });
    animatedToggle.addEventListener('change', () => { currentPage = 1; applyFilters(); });
    coloredToggle.addEventListener('change', () => { currentPage = 1; applyFilters(); });

    // Slider setup
    function setupSlider(sliderId, progressId, thumbId, valueId, min, max, step, onUpdate) {
      const slider = document.getElementById(sliderId);
      const progress = document.getElementById(progressId);
      const thumb = document.getElementById(thumbId);
      const valueText = document.getElementById(valueId);

      let isDragging = false;
      let sliderRect = slider.getBoundingClientRect();

      const updateByPercent = (percent) => {
        percent = Math.max(0, Math.min(100, percent));
        const px = (percent / 100) * sliderRect.width;
        progress.style.width = `${percent}%`;
        thumb.style.left = `${px}px`;

        let rawVal = min + (percent / 100) * (max - min);
        let val = Math.round(rawVal / step) * step;
        if (step < 1) val = parseFloat(val.toFixed(1));

        onUpdate(val, valueText);
      };

      const setFromValue = (val) => {
        const percent = ((val - min) / (max - min)) * 100;
        sliderRect = slider.getBoundingClientRect();
        const px = (percent / 100) * sliderRect.width;
        progress.style.width = `${percent}%`;
        thumb.style.left = `${px}px`;
        onUpdate(val, valueText);
      };

      const getPercent = (clientX) => ((clientX - sliderRect.left) / sliderRect.width) * 100;

      thumb.addEventListener('mousedown', () => { isDragging = true; sliderRect = slider.getBoundingClientRect(); thumb.classList.add('active'); });
      thumb.addEventListener('touchstart', () => { isDragging = true; sliderRect = slider.getBoundingClientRect(); thumb.classList.add('active'); }, { passive: true });

      document.addEventListener('mousemove', (e) => { if (isDragging) updateByPercent(getPercent(e.clientX)); });
      document.addEventListener('mouseup', () => { isDragging = false; thumb.classList.remove('active'); });
      document.addEventListener('touchmove', (e) => { if (isDragging) updateByPercent(getPercent(e.touches[0].clientX)); }, { passive: true });
      document.addEventListener('touchend', () => { isDragging = false; thumb.classList.remove('active'); });

      slider.addEventListener('mousedown', (e) => {
        sliderRect = slider.getBoundingClientRect();
        updateByPercent(getPercent(e.clientX));
      });

      return { setFromValue };
    }

    const sizeSliderCtrl = setupSlider('sizeSlider', 'sizeProgress', 'sizeThumb', 'sizeValue', 12, 256, 2, (val, textElem) => {
      iconSizeVal = val;
      textElem.innerText = val + 'px';
      renderGrid();
    });

    async function loadSvgFile(fileName) {
      if (loadedFilesCache.has(fileName)) return loadedFilesCache.get(fileName);
      try {
        const res = await fetch(`save/${fileName}`);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();
        loadedFilesCache.set(fileName, data);
        return data;
      } catch (e) {
        console.error(`Error loading save/${fileName}:`, e);
        return null;
      }
    }

    async function initIcons() {
      colorPicker.value = savedColor;
      hexInput.value = savedColor;
      sizeSliderCtrl.setFromValue(24);

      iconGrid.innerHTML = `
        <div class="loading-state-container">
          <i class="ci ci-ms7-bubble-loading loading-spinner-icon"></i>
          <span>Loading icons...</span>
        </div>`;

      try {
        const response = await fetch('save/svgs.json');
        if (!response.ok) throw new Error("Index file save/svgs.json not found");
        const masterIndex = await response.json();
        indexData = masterIndex.indices || [];

        if (masterIndex.totalSvgs) {
          totalCountText.innerText = `${masterIndex.totalSvgs.toLocaleString()} icons`;
        }

        categorySelect.innerHTML = '<option value="all">All Sets</option>';
        indexData.forEach(item => {
          const option = document.createElement('option');
          option.value = item.file;
          const displayName = item.file.replace('.json', '');
          option.innerText = `${displayName} (${item.count})`;
          categorySelect.appendChild(option);

          const fileTag = item.file.replace('.json', '');
          // Robust key generation: Use provided key OR sanitized fileTag to prevent cross-library collisions
          const encryptionKey = item.key || fileTag.replace(/[^a-zA-Z0-9]/g, '');

          masterMetadata.set(item.file, {
            key: encryptionKey,
            animated: item.animated || false,
            colored: item.colored || false,
            isNew: item.new || false
          });

          hashMap.set(encryptionKey, item.file);
        });

        const initialHash = window.location.hash.substring(1);
        if (initialHash) await handleDirectHashRoute(initialHash);

        const allFiles = indexData.map(i => i.file);
        await Promise.all(allFiles.map(file => loadSvgFile(file)));
        processIconsFromFiles(allFiles);

      } catch (error) {
        console.warn("Could not load save/svgs.json.", error);
        totalCountText.innerText = '0 icons';
      }
    }

    async function handleDirectHashRoute(hashParam) {
      const parts = hashParam.split('-');
      const hashPrefix = parts[0];
      const targetFile = hashMap.get(hashPrefix);

      if (targetFile) {
        const fileData = await loadSvgFile(targetFile);
        if (fileData) {
          processIconsFromFiles([targetFile]);
          const targetIcon = iconsData.find(i => i.id.toLowerCase() === hashParam.toLowerCase());
          if (targetIcon) openModal(targetIcon);
        }
      }
    }

    function processIconsFromFiles(files) {
      const newIcons = [];

      files.forEach(fileName => {
        const fileData = loadedFilesCache.get(fileName);
        if (!fileData || !fileData.icons) return;

        const info = fileData.info || {};
        const fileIcons = fileData.icons;
        const fileTag = fileName.replace('.json', '');

        const metadata = masterMetadata.get(fileName) || { key: fileTag.replace(/[^a-zA-Z0-9]/g, ''), animated: false, colored: false };
        const authorName = info.author?.name || 'Unknown';

        if (authorName !== 'Unknown') allAuthors.add(authorName);

        Object.keys(fileIcons).forEach(key => {
          const uniqueId = `${metadata.key}-${key}`;
          const iconObj = fileIcons[key];

          const isIconSpecificAnimated = typeof iconObj === 'object' && (iconObj.animated === true || iconObj.animated === "true");
          const isAnimatedFinal = metadata.animated || isIconSpecificAnimated;
          const isColoredFinal = metadata.colored || COLOR_PRESERVED_LIBRARIES.some(lib => fileTag.toLowerCase().includes(lib));

          if (!iconsData.some(i => i.id === uniqueId)) {
            newIcons.push({
              id: uniqueId,
              hash: metadata.key,
              name: key,
              sourceSet: fileTag,
              version: (typeof iconObj === 'object' && iconObj.version) ? iconObj.version : "1.0.0",
              category: (typeof iconObj === 'object' && iconObj.category) || info.category || info.name || "General",
              author: authorName,
              animated: isAnimatedFinal,
              colored: isColoredFinal,
              svg: (typeof iconObj === 'object' && iconObj.svg) ? iconObj.svg : iconObj,
              fileSource: fileName,
              info: info
            });
          }
        });
      });

      iconsData = [...iconsData, ...newIcons];
      totalCountText.innerText = `${iconsData.length.toLocaleString()} icons`;

      const currentAuthorSelection = authorSelect.value;
      authorSelect.innerHTML = '<option value="all">All Authors</option>';
      Array.from(allAuthors).sort().forEach(author => {
        const opt = document.createElement('option');
        opt.value = author;
        opt.innerText = author;
        authorSelect.appendChild(opt);
      });
      authorSelect.value = currentAuthorSelection;

      applyFilters();
    }

    function getSearchRank(icon, query) {
      if (!query) return 0;
      const name = icon.name.toLowerCase();
      const source = icon.sourceSet.toLowerCase();

      if (name === query) return 1;
      const boundaryRegex = new RegExp(`(^|[-_/${'\\s'}])` + escapeRegex(query) + `([-_/${'\\s'}]|$)`);
      if (boundaryRegex.test(name)) return 2;
      if (name.startsWith(query)) return 3;
      if (name.includes(query)) return 4;
      if (source.includes(query)) return 5;
      return 99;
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedCategory = categorySelect.value;
      const selectedAuthor = authorSelect.value;
      const sort = sortSelect.value;

      const showAnimatedOnly = animatedToggle.checked;
      const showColoredOnly = coloredToggle.checked;

      let baseSet = iconsData;

      if (selectedCategory !== 'all') {
        baseSet = baseSet.filter(i => i.fileSource === selectedCategory);
      }
      if (selectedAuthor !== 'all') {
        baseSet = baseSet.filter(i => i.author === selectedAuthor);
      }
      if (showAnimatedOnly) {
        baseSet = baseSet.filter(i => i.animated);
      }
      if (showColoredOnly) {
        baseSet = baseSet.filter(i => i.colored);
      }

      if (!query) {
        filteredIcons = [...baseSet];
        filteredIcons.sort((a, b) => {
          if (sort === 'name-asc') return a.name.localeCompare(b.name);
          if (sort === 'name-desc') return b.name.localeCompare(a.name);
          if (sort === 'version') return b.version.localeCompare(a.version);
        });
      } else {
        filteredIcons = baseSet
          .map(icon => ({ icon, rank: getSearchRank(icon, query) }))
          .filter(item => item.rank < 99)
          .sort((a, b) => {
            if (a.rank !== b.rank) return a.rank - b.rank;
            if (sort === 'name-asc') return a.icon.name.localeCompare(b.icon.name);
            if (sort === 'name-desc') return b.icon.name.localeCompare(a.icon.name);
            if (sort === 'version') return b.icon.version.localeCompare(a.icon.version);
            return 0;
          })
          .map(item => item.icon);
      }

      renderGrid();
      renderPaginationBar();
    }

    function formatSvgString(svgString, customColor, isColored, uniqueId) {
      // 1. RAW INJECTION for Colored Flags (Preserves Animations, Layouts, and Mask references perfectly)
      if (isColored) {
        return svgString;
      }

      // 2. Safe DOM Manipulation for Recolor & Scalability
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgString, 'image/svg+xml');
        const svgEl = doc.querySelector('svg');
        if (!svgEl) return svgString;

        // Force scalable ViewBox if missing
        if (!svgEl.hasAttribute('viewBox')) {
          const w = svgEl.getAttribute('width');
          const h = svgEl.getAttribute('height');
          const pw = parseFloat(w) || 24;
          const ph = parseFloat(h) || 24;
          svgEl.setAttribute('viewBox', `0 0 ${pw} ${ph}`);
        }

        // Clean up explicit widths/heights so CSS sizing takes over perfectly 
        svgEl.removeAttribute('width');
        svgEl.removeAttribute('height');

        // Safe ID collision rewritter (Critical for List Views)
        const idMap = {};
        svgEl.querySelectorAll('[id]').forEach(el => {
          const oldId = el.getAttribute('id');
          if (oldId && !oldId.startsWith('ci-')) {
            const newId = `ci-${uniqueId}-${oldId}`.replace(/[^a-zA-Z0-9-_]/g, '');
            el.setAttribute('id', newId);
            idMap[oldId] = newId;
          }
        });

        // Remap url(#id) references
        if (Object.keys(idMap).length > 0) {
          svgEl.querySelectorAll('*').forEach(el => {
            Array.from(el.attributes).forEach(attr => {
              let val = attr.value;
              if (val.includes('url(#')) {
                Object.keys(idMap).forEach(oldId => {
                  val = val.split(`url(#${oldId})`).join(`url(#${idMap[oldId]})`);
                });
                if (val !== attr.value) el.setAttribute(attr.name, val);
              }
              if ((attr.name === 'href' || attr.name === 'xlink:href') && val.startsWith('#')) {
                const oldId = val.substring(1);
                if (idMap[oldId]) el.setAttribute(attr.name, `#${idMap[oldId]}`);
              }
            });
          });
        }

        // Deep Apply Color (Defaults properly to Root & Overrides)
        svgEl.style.color = customColor;
        const rootFill = svgEl.getAttribute('fill');
        if (!rootFill || (rootFill !== 'none' && !rootFill.includes('url('))) {
          svgEl.setAttribute('fill', customColor);
        }

        const applyColor = (el) => {
          const fillAttr = el.getAttribute('fill');
          if (fillAttr && fillAttr !== 'none' && !fillAttr.includes('url(')) {
            el.setAttribute('fill', customColor);
          }
          if (el.style && el.style.fill && el.style.fill !== 'none' && !el.style.fill.includes('url(')) {
            el.style.fill = customColor;
          }

          const strokeAttr = el.getAttribute('stroke');
          if (strokeAttr && strokeAttr !== 'none' && !strokeAttr.includes('url(')) {
            el.setAttribute('stroke', customColor);
          }
          if (el.style && el.style.stroke && el.style.stroke !== 'none' && !el.style.stroke.includes('url(')) {
            el.style.stroke = customColor;
          }
        };
        svgEl.querySelectorAll('path, circle, rect, polygon, polyline, ellipse, line, g').forEach(applyColor);

        return new XMLSerializer().serializeToString(svgEl);
      } catch (e) {
        console.error("SVG Formatting Error: ", e);
        return svgString;
      }
    }

    function renderGrid() {
      iconGrid.innerHTML = '';

      if (isCompactMode) {
        iconGrid.classList.add('compact-mode');
      } else {
        iconGrid.classList.remove('compact-mode');
      }

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginatedItems = filteredIcons.slice(start, end);

      if (paginatedItems.length === 0) {
        iconGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No icons found matching your filters.</p>';
        return;
      }

      const fragment = document.createDocumentFragment();

      paginatedItems.forEach(icon => {
        const card = document.createElement('div');
        card.className = isCompactMode ? 'icon-card compact-tile' : 'icon-card';
        card.title = `${icon.name} (${icon.sourceSet})`;

        // Use custom sizing in Grid via explicit CSS injection on the Wrapper
        const gridDisplaySize = isCompactMode ? Math.min(iconSizeVal, 32) : Math.min(iconSizeVal, 48);
        const previewSvg = formatSvgString(icon.svg, colorPicker.value, icon.colored, icon.id);

        const animatedTagHtml = icon.animated ? `<span class="animated-badge">animated</span>` : '';
        const animatedDotHtml = icon.animated ? `<span class="animated-dot-compact" title="Animated Icon"></span>` : '';

        if (isCompactMode) {
          card.innerHTML = `
          ${animatedDotHtml}
          <div class="svg-container" style="display:flex; justify-content:center; align-items:center; width:${gridDisplaySize}px; height:${gridDisplaySize}px;">
            ${previewSvg}
          </div>
        `;
        } else {
          card.innerHTML = `
          <div class="svg-container" style="display:flex; justify-content:center; align-items:center; width:${gridDisplaySize}px; height:${gridDisplaySize}px; min-height:52px; margin: 0 auto;">
            ${previewSvg}
          </div>
          <div class="icon-name">${icon.name}</div>
          <div class="icon-source-tag">${icon.sourceSet}</div>
          ${animatedTagHtml}
          <div class="icon-version">v${icon.version}</div>
        `;
        }

        card.addEventListener('click', () => {
          window.location.hash = icon.id;
        });

        fragment.appendChild(card);
      });

      iconGrid.appendChild(fragment);
    }

    function renderPaginationBar() {
      paginationBar.innerHTML = '';

      const totalPages = Math.ceil(filteredIcons.length / itemsPerPage);
      if (totalPages <= 1) return;

      let startPage;
      if (totalPages <= 3) {
        startPage = 1;
      } else if (currentPage === 1 || currentPage === 2) {
        startPage = 1;
      } else if (currentPage === totalPages || currentPage === totalPages - 1) {
        startPage = totalPages - 2;
      } else {
        startPage = currentPage - 1;
      }

      const endPage = Math.min(startPage + 2, totalPages);

      const firstBtn = document.createElement('button');
      firstBtn.className = 'page-arrow-btn';
      firstBtn.innerHTML = '«';
      firstBtn.title = 'First Page';
      firstBtn.disabled = currentPage === 1;
      firstBtn.onclick = () => { if (currentPage > 1) changePage(1); };
      paginationBar.appendChild(firstBtn);

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-arrow-btn';
      prevBtn.innerHTML = '‹';
      prevBtn.title = 'Previous Page';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { if (currentPage > 1) changePage(currentPage - 1); };
      paginationBar.appendChild(prevBtn);

      const pagesContainer = document.createElement('div');
      pagesContainer.className = 'page-dots-container';

      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-dot ${i === currentPage ? 'active' : ''}`;
        pageBtn.innerHTML = i;
        pageBtn.title = `Page ${i}`;
        pageBtn.onclick = () => { if (i !== currentPage) changePage(i); };
        pagesContainer.appendChild(pageBtn);
      }

      paginationBar.appendChild(pagesContainer);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-arrow-btn';
      nextBtn.innerHTML = '›';
      nextBtn.title = 'Next Page';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { if (currentPage < totalPages) changePage(currentPage + 1); };
      paginationBar.appendChild(nextBtn);

      const lastBtn = document.createElement('button');
      lastBtn.className = 'page-arrow-btn';
      lastBtn.innerHTML = '»';
      lastBtn.title = 'Last Page';
      lastBtn.disabled = currentPage === totalPages;
      lastBtn.onclick = () => { if (currentPage < totalPages) changePage(totalPages); };
      paginationBar.appendChild(lastBtn);
    }

    function changePage(page) {
      if (page === currentPage) return;
      currentPage = page;
      renderGrid();
      renderPaginationBar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', checkUrlHash);

    async function checkUrlHash() {
      const hash = window.location.hash.substring(1);
      if (hash) {
        let icon = iconsData.find(i => i.id.toLowerCase() === hash.toLowerCase()) ||
          iconsData.find(i => i.name.toLowerCase() === hash.toLowerCase());

        if (!icon) {
          await handleDirectHashRoute(hash);
        } else {
          openModal(icon);
        }
      } else {
        closeModal();
      }
    }

    function openModal(icon) {
      let modalColor = colorPicker.value;
      let modalSize = iconSizeVal;

      const info = icon.info || {};
      const authorName = info.author?.name || 'Unknown Author';
      const authorUrl = info.author?.url || '#';
      const licenseTitle = info.license?.title || info.license?.spdx || 'Unspecified License';
      const licenseUrl = info.license?.url || '#';

      function updateModalContent() {
        const updatedSvg = formatSvgString(icon.svg, modalColor, icon.colored, icon.id);
        const htmlSnippet = `<i class="ci ci-${icon.id}" style="font-size: ${modalSize}px;"></i>`;

        const previewContainer = modalBody.querySelector('#modalIconPreview');
        if (previewContainer) previewContainer.innerHTML = updatedSvg;

        const htmlBox = modalBody.querySelector('#modalHtmlSnippetBox');
        const svgBox = modalBody.querySelector('#modalSvgSnippetBox');
        if (htmlBox) htmlBox.textContent = htmlSnippet;
        if (svgBox) svgBox.textContent = updatedSvg;

        const downloadBtnSVG = modalBody.querySelector('#modalDownloadBtnSVG');
        const downloadBtnPNG = modalBody.querySelector('#modalDownloadBtnPNG');
        if (downloadBtnSVG) {
          downloadBtnSVG.setAttribute('onclick', `downloadPrompt('${icon.name}', \`${encodeURIComponent(updatedSvg)}\`, 'svg')`);
        }
        if (downloadBtnPNG) {
          downloadBtnPNG.setAttribute('onclick', `downloadPrompt('${icon.name}', \`${encodeURIComponent(updatedSvg)}\`, 'png')`);
        }
      }

      modalBody.innerHTML = `
      <div id="modalIconPreview" class="svg-container" style="margin: 1rem auto; display:flex; justify-content:center; align-items:center; width:${modalSize}px; height:${modalSize}px; min-height:80px;">
        ${formatSvgString(icon.svg, modalColor, icon.colored, icon.id)}
      </div>
      <h2 style="margin: 0; font-size: 1.3rem; font-weight: 600;">${icon.name}</h2>
      <p style="font-size: 0.82rem; opacity: 0.7; margin: 0 0 6px 0;">Library: ${icon.sourceSet} &bull; Category: ${icon.category} &bull; Version: v${icon.version}</p>

      <div style="width: 100%; display: flex; justify-content: space-around; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 8px;">
        <div>
          <span style="opacity:0.6;">Author:</span> 
          ${authorUrl !== '#' ? `<a href="${authorUrl}" target="_blank" style="color:var(--text-color, #3b82f6); text-decoration:underline;">${authorName}</a>` : `<span>${authorName}</span>`}
        </div>
        <div>
          <span style="opacity:0.6;">License:</span> 
          ${licenseUrl !== '#' ? `<a href="${licenseUrl}" target="_blank" style="color:var(--text-color, #3b82f6); text-decoration:underline;">${licenseTitle}</a>` : `<span>${licenseTitle}</span>`}
        </div>
      </div>

      <div style="width: 100%; text-align: left; margin-top: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
          <label style="font-size: 0.75rem; opacity: 0.6; font-weight: 500;">HTML Snippet:</label>
          <div style="display: flex; gap: 6px;">
            <button class="copy-box-btn" onclick="copyCode(document.getElementById('modalHtmlSnippetBox').textContent)" title="Copy HTML">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button class="copy-box-btn" onclick="copyUrl(document.getElementById('modalSvgSnippetBox').textContent)" title="Copy SVG URL" style="display: flex; align-items: center; gap: 4px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer;">
              URL
            </button>
          </div>
        </div>
        <div class="code-box-wrapper">
          <div class="code-box" id="modalHtmlSnippetBox"></div>
        </div>
      </div>

      <div style="width: 100%; text-align: left; margin-top: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label style="font-size: 0.75rem; opacity: 0.6; font-weight: 500;">SVG Source Code:</label>
            
            <div style="display: flex; gap: 6px;">
                <label style="font-size: 0.75rem; opacity: 0.6; font-weight: 500; margin-top: 5px;">Copy :</label>
                <button class="copy-box-btn" onclick="copySvgCode(document.getElementById('modalSvgSnippetBox').textContent)" title="Copy SVG Source" style="display: flex; align-items: center; gap: 4px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer;">
                  SVG
                </button>
                <button class="copy-box-btn" onclick="copySvgBase64(document.getElementById('modalSvgSnippetBox').textContent)" title="Copy Base64 Data URI" style="display: flex; align-items: center; gap: 4px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer;">
                  URI
                </button>
            </div>
        </div>
        
        <div class="code-box-wrapper">
            <div class="code-box" id="modalSvgSnippetBox"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn green" onclick="">Edit</button>
        <button id="modalDownloadBtnSVG" class="modal-btn primary">SVG</button>
        <button id="modalDownloadBtnPNG" class="modal-btn primary">PNG</button>
        <button class="modal-icon-btn" onclick="shareIcon('${icon.id}')" title="Share Link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
      </div>
    `;

      updateModalContent();
      iconModal.classList.add('active');
    }

    function closeModal() {
      iconModal.classList.remove('active');
      if (window.location.hash) {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
    }

    closeModalBtn.addEventListener('click', closeModal);
    iconModal.addEventListener('click', (e) => {
      if (e.target === iconModal) closeModal();
    });

    window.copyCode = function (text) {
      navigator.clipboard.writeText(text);
      showToast('HTML snippet copied to clipboard!', '#333');
    };

    window.copyUrl = function (text) {
      const classMatch = text.match(/class="[^"]*ci\s+ci-([^"\s]+)/);
      const iconName = classMatch ? classMatch[1] : '';

      let url = `https://ci-icons.vercel.app/ci.html#${iconName}`;

      const colorMatch = text.match(/style="[^"]*color:\s*([^;"]+)/i);
      if (colorMatch) {
          const color = colorMatch[1].trim().replace(/^#/, '');
          url += `#${color}`;
      }

      navigator.clipboard.writeText(url);
      showToast('URL copied to clipboard!', '#333');
  };

    function copySvgCode(svgText) {
      try {
        navigator.clipboard.writeText(svgText).then(() => {
          showToast('SVG code copied to clipboard!', '#333');
        });
      } catch (error) {
        showToast('Failed to copy SVG code', '#e74c3c');
      }
    }

    function copySvgBase64(svgText) {
      try {
        const base64Data = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgText)));
        navigator.clipboard.writeText(base64Data).then(() => {
          showToast('Base64 Data URI copied!', '#333');
        });
      } catch (error) {
        showToast('Failed to generate Base64', '#e74c3c');
      }
    }

    window.downloadPrompt = function (name, encodedSvg, format = 'svg') {
      const svg = decodeURIComponent(encodedSvg);

      if (format.toLowerCase() === 'png') {
        const img = new Image();
        const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = iconSizeVal;
          canvas.height = iconSizeVal;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, iconSizeVal, iconSizeVal);

          const pngData = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = pngData;
          a.download = `${name}-${iconSizeVal}px.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobURL);
        };
        img.src = blobURL;
      } else {
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${name}.svg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    };

    window.shareIcon = function (id) {
      const url = window.location.origin + window.location.pathname + '#' + id;
      navigator.clipboard.writeText(url);
      showToast('Direct link copied to clipboard!', '#333');
    };

    initIcons();
  </script>
</body>
